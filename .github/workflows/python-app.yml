
name: my-first-workflow

on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2-checkout
        uses: actions/checkout@v2.8.0
      - name: step3
        run: |
          pwd
          ls -ltr
          hostname
      - name: creating file for upload
        run: echo "hello world this is a text for artifact file">>artifact.txt
      - name: Upload a artifacts in github
        uses: actions/upload-artifact@v7.0.2
        with: 
          name: uploading single file as artifacts
          path: ./artifact.txt
      - name: creating a directory
        run: |
          mkdir pappu
          echo "hello world">pappu/list.txt
          echo "hello pappu">pappu/set.txt
      - name: Upload a directory in github
        uses: actions/upload-artifact@v7.0.2
        with:
          name: uploading a directory
          path: pappu/
        

       


