
name: my-first-workflow

on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2-checkout
        uses: actions/checkout@v2.8.0
      - name: step3
        run: |
          pwd
          ls -ltr
          hostname
      - name: creating file for upload
        run: echo "hello world this is a text for artifact file">>artifact.txt
      - name: Upload a single file
        uses: actions/upload-artifact@v7.0.2
        with: 
          name: single_file
          path: ./artifact.txt
      - name: creating a directory
        run: |
          mkdir pappu
          echo "hello world">pappu/list.txt
          echo "hello pappu">pappu/set.txt
      - name: Upload a directory in github
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory
          path: pappu/
      - name: Upload a multiple path
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_path
          path: |
            ./artifact.txt
            pappu/list.txt
      - name: Upload multiple path with exclusion
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_path_with_exclusion
          path: |
            pappu/
            ./artifact.txt
            !pappu/list.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: download single file artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: single_file
      - name: checking download file background
        run: |
          pwd
          ls -ltr


  job3:
    name: JOB3
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltd
      - name: download directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: directory

      - name: Checking current directory
        run: |
          pwd
          ls -ltd
      
  

       


